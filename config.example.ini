[cursor-attention]
# Seconds after the approval card appears before the first reminder.
delay_seconds = 15

# Seconds between reminders while that card is still waiting. Minimum 5.
repeat_seconds = 15

# How often to read new log lines.
poll_seconds = 0.4

# Spoken line, and the notification text.
phrase = Approve please

# Notification title.
title = Cursor

# macOS voice for `say`. Empty uses the system voice. Ignored when sound is set.
voice =

# Optional audio file. Empty speaks the phrase with `say`.
sound =

# One notification when a wait starts. Later repeats are sound only.
notify = yes

# Cursor's log folder. Empty uses ~/Library/Application Support/Cursor/logs.
cursor_log_dir =
